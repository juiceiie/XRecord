name: XRecord
options:
  bundleIdPrefix: com.xrecord
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: XRecord
    MARKETING_VERSION: "1.3.3"
    CURRENT_PROJECT_VERSION: "16"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "XRecord Self-Signed"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  XRecord:
    type: application
    platform: macOS
    sources:
      - path: XRecord
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: XRecord/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
    entitlements:
      path: XRecord/Resources/XRecord.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.cs.disable-library-validation: true

  XRecordTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: XRecordTests
      # 直接复用 App 的服务/模型源码，做成无宿主的逻辑测试，避免启动 App 或触碰真实钥匙串
      - path: XRecord/Models/DataModels.swift
      - path: XRecord/Services/EncryptionService.swift
      - path: XRecord/Services/KeychainService.swift
      - path: XRecord/Services/DataService.swift
    settings:
      base:
        PRODUCT_NAME: XRecordTests
        PRODUCT_BUNDLE_IDENTIFIER: com.xrecord.XRecordTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  XRecord:
    build:
      targets:
        XRecord: all
    run:
      config: Debug
  XRecordTests:
    build:
      targets:
        XRecordTests: all
    test:
      config: Debug
      targets:
        - XRecordTests
